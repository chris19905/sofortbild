<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Codes erzeugen</title>
<style>
body{margin:0;background:#17150F;color:#EDE7D8;font:15px system-ui;padding:30px;
     display:flex;flex-direction:column;align-items:center;gap:20px}
h1{font-size:19px;letter-spacing:.16em;text-transform:uppercase;margin:0}
p{max-width:52ch;line-height:1.62;color:#8A8272;margin:0;text-align:center}
.row{display:flex;gap:10px;align-items:center}
input,button{font:inherit;padding:10px 14px;border-radius:3px;border:1px solid #2f2a21}
input{width:80px;background:#201C15;color:#EDE7D8;text-align:center}
button{background:#F4F0E4;color:#1A1712;border:0;font-weight:600;cursor:pointer}
button:hover{background:#fff}
textarea{width:min(100%,460px);height:300px;background:#201C15;color:#EDE7D8;
  border:1px solid #2f2a21;border-radius:3px;padding:14px;font:14px ui-monospace,Consolas,monospace;
  letter-spacing:.06em;line-height:1.7}
</style></head><body>

<h1>Freischaltcodes</h1>
<p>Jeder Code funktioniert genau einmal pro Gerät und läuft nicht ab. Erzeuge
dir einen Vorrat und gib nach jedem Kauf einen davon heraus — streiche
vergebene aus deiner Liste, damit du nicht denselben zweimal verkaufst.</p>

<div class="row">
  <input type="number" id="n" value="25" min="1" max="500">
  <button id="go">Erzeugen</button>
  <button id="copy">Kopieren</button>
</div>
<textarea id="out" readonly></textarea>

<script>
var AB='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // ohne I,O,0,1 — keine Verwechslung

function make(){
  var body='',i;
  for(i=0;i<9;i++) body+=AB[Math.floor(Math.random()*AB.length)];
  var h=0;
  for(i=0;i<body.length;i++) h=(h*31+body.charCodeAt(i))%46656;
  var chk=h.toString(36).toUpperCase();
  while(chk.length<3) chk='0'+chk;
  var full='SOFO'+body+chk;
  return full.slice(0,4)+'-'+full.slice(4,8)+'-'+full.slice(8,12)+'-'+full.slice(12);
}

function run(){
  var n=Math.min(500,Math.max(1,parseInt(document.getElementById('n').value,10)||25));
  var seen={},list=[];
  while(list.length<n){ var c=make(); if(!seen[c]){ seen[c]=1; list.push(c); } }
  document.getElementById('out').value=list.join('\n');
}
document.getElementById('go').onclick=run;
document.getElementById('copy').onclick=function(){
  var o=document.getElementById('out'); o.select();
  try{ document.execCommand('copy'); this.textContent='Kopiert';
       var b=this; setTimeout(function(){ b.textContent='Kopieren'; },1500); }catch(e){}
};
run();
</script>
</body></html>
